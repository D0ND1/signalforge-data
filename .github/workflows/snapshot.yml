name: daily-snapshot
on:
  schedule:
    - cron: "17 7 * * *"   # every day 07:17 UTC (an odd minute avoids the top-of-hour rush)
  workflow_dispatch: {}
permissions:
  contents: write          # only this job may write, and only to this repo
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TODO(owner/Claude): pin both actions to commit SHAs (Settings -> Actions, or `gh api`), then enable Dependabot for github-actions.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot recalls and releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python snapshot.py
      - name: Commit changes
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          # a keepalive line makes sure the repo shows activity, because GitHub pauses scheduled workflows on public repos
          # after 60 days without activity (GitHub docs; confirm in the first month that the daily commits keep it running)
          date -u +%FT%TZ > data/.keepalive
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
