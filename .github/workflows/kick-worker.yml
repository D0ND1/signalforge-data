name: kick-worker
# Starts the private SignalForge worker on Kaggle (D-125). This public repo only sends "run now": the worker code is
# pushed as a private Kaggle kernel and clones the private repo itself. Nothing private appears in these logs.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: kick-worker
  cancel-in-progress: false
jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Push the worker kernel (Kaggle runs it)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          test -n "$KAGGLE_USERNAME" || { echo "::error::KAGGLE_USERNAME secret missing"; exit 1; }
          python -m pip install -q kaggle
          mkdir -p /tmp/k && cp worker/bootstrap.py /tmp/k/
          cat > /tmp/k/kernel-metadata.json <<EOF
          {"id": "$KAGGLE_USERNAME/signalforge-worker", "title": "signalforge-worker", "code_file": "bootstrap.py",
           "language": "python", "kernel_type": "script", "is_private": true, "enable_gpu": false,
           "enable_internet": true, "dataset_sources": [], "competition_sources": [], "kernel_sources": []}
          EOF
          kaggle kernels push -p /tmp/k > /dev/null && echo "worker started"
